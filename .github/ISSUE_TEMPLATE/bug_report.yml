name: Bug report
description: Report a reproducible problem in ADAY
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove API keys, private presentations and personal data before submitting.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: "1. Start the server…\n2. Open…\n3. Select…"
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Revision
      description: Commit hash or release tag.
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - Windows
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed secrets and private data.
          required: true
